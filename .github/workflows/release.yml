name: release

# Publica el instalador de OWS Hub como GitHub Release + manifiesto del updater.
# El frontend (web/OWS) NO vive en este repo: se toma de owsdatabase en cada build,
# así que la fuente única sigue siendo el monorepo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 3.1.4). Vacío = la de src-tauri/tauri.conf.json'
        required: false
        default: ''

permissions:
  contents: write

env:
  FRONTEND_REPO: OceanandWild/owsdatabase
  FRONTEND_PATH: web/OWS

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Fail-fast: si falta GH_PAT (token con scope repo para crear la
      # release) el publish falla AL FINAL tras compilar ~20 min, como pasó
      # con v3.4.3 y v3.4.4. Esto lo detecta en 10 segundos.
      - name: Validar secrets de publicación
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          TAURI_KEY: ${{ secrets.KEY }}
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:GH_PAT)) { $missing += 'GH_PAT (token con scope repo, para crear la release)' }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_KEY)) { $missing += 'KEY (clave de firma del updater)' }
          if ($missing.Count) { throw ('Faltan secrets del repo ows-hub: ' + ($missing -join ' · ') + '. Settings → Secrets and variables → Actions.') }
          Write-Host '[release] Secrets de publicación presentes.'

      - name: Fetch frontend (owsdatabase/web/OWS)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: main
          path: .frontend-src
          sparse-checkout: ${{ env.FRONTEND_PATH }}
          sparse-checkout-cone-mode: false

      - name: Sync frontend -> app
        shell: pwsh
        run: ./scripts/sync-app.ps1 -Source .frontend-src/web/OWS

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci || npm install

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $cfg = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $v = "${{ inputs.version }}".Trim()
          if (-not $v) { $v = [string]$cfg.version }
          if (-not $v.StartsWith('v')) { $v = "v$v" }
          $want = $v.TrimStart('v')
          if ($want -ne [string]$cfg.version) {
            Write-Host "[release] Actualizando tauri.conf.json a $want"
            $raw = (Get-Content src-tauri/tauri.conf.json -Raw) -replace '"version":\s*"[0-9.]+"', "`"version`": `"$want`""
            [IO.File]::WriteAllText((Resolve-Path src-tauri/tauri.conf.json), $raw)
            # OJO: solo la linea de [package]. Un regex pelado sobre todo el
            # archivo ('version = "..."') tambien pisa las versiones de las
            # dependencias (reqwest 0.12 -> 3.4.8) y cargo revienta con
            # "failed to select a version for the requirement". Partimos el
            # TOML por [package] y solo se reescribe ese bloque.
            $toml = Get-Content src-tauri/Cargo.toml -Raw
            $idx = $toml.IndexOf('[package]')
            if ($idx -lt 0) { throw "No se encontro la seccion [package] en Cargo.toml" }
            $next = $toml.IndexOf('[', $idx + 1)
            if ($next -lt 0) { $next = $toml.Length }
            $head = $toml.Substring(0, $idx)
            $block = $toml.Substring($idx, $next - $idx)
            $tail = $toml.Substring($next)
            $block = $block -replace '(?m)^version\s*=\s*"[0-9.]+"', "version = `"$want`""
            if ($block -notmatch '(?m)^version\s*=') { throw "No se pudo fijar la version en [package]" }
            [IO.File]::WriteAllText((Resolve-Path src-tauri/Cargo.toml), ($head + $block + $tail))
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $pkg.version = $want
            [IO.File]::WriteAllText((Resolve-Path package.json), ($pkg | ConvertTo-Json -Depth 10))
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build (NSIS + MSI)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Secrets del repo: KEY (clave de firma), PASSWORD (su password).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PASSWORD }}
        # Sin flags extra: el CLI 2.x no tiene --no-bundle-version-check
        # (ese flag inexistente tumbaba este paso al instante).
        run: npx tauri build

      - name: Publish release + updater manifest
        shell: pwsh
        env:
          # GH_PAT (token con scope repo) para crear la release.
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.ver.outputs.version }}
          # publish-release.ps1 firma a mano los instaladores si el bundler
          # no dejo .sig: sin estas dos env no hay latest.json y el updater
          # queda inactivo (eso paso en el primer run de v3.2.0).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.PASSWORD }}
        run: ./scripts/publish-release.ps1 -Tag $env:TAG